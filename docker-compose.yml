services:
  # Servicio de Base de Datos MySQL 8
  db:
    image: mysql:8.0
    container_name: terrabit
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: terrabit
      MYSQL_USER: terrabit_user
      MYSQL_PASSWORD: terrabit_password
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./Backend/database/estructura.sql:/docker-entrypoint-initdb.d/1_estructura.sql
      - ./Backend/database/seed.sql:/docker-entrypoint-initdb.d/2_seed.sql
    networks:
      - terrabit_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Servicio de API Backend (PHP 8.2 + Apache)
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: terrabit_backend
    restart: always
    ports:
      - "8080:80"
    environment:
      DB_HOST: db
      DB_NAME: terrabit
      DB_USER: terrabit_user
      DB_PASSWORD: terrabit_password
    depends_on:
      db:
        condition: service_healthy
    networks:
      - terrabit_network

  # Servicio de Frontend (Servidor Web Apache)
  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: terrabit_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - terrabit_network
  # Servicio de phpMyAdmin
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: terrabit_phpmyadmin
    restart: always
    environment:
      PMA_HOST: db
      PMA_USER: terrabit_user
      PMA_PASSWORD: terrabit_password
    ports:
      - "8081:80"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - terrabit_network
volumes:
  db_data:

networks:
  terrabit_network:
    driver: bridge